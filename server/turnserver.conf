# coturn TURN/STUN server configuration — WU CA1.
#
# Mounted into coturn/coturn at /etc/coturn/turnserver.conf.
# Reference: https://github.com/coturn/coturn/blob/master/examples/etc/turnserver.conf
#
# IMPORTANT: `static-auth-secret` is added at start into a private copy of
# this file (docker-compose.yml coturn `entrypoint`, from TURN_SHARED_SECRET)
# — never hardcoded here and never on the command line, where `ps` shows it.
#
# Spec: §10.2 — TURN-config via sinhron-server (REST API shared-secret
# based per RFC 5766, supported by coturn natively).

# STUN/TURN listening port (UDP + TCP). TURN-over-TLS for 443-only
# networks is terminated by Caddy (layer4, SNI = SINHRON_TURN_HOSTNAME)
# and arrives here as plain TCP — so coturn itself stays no-tls/no-dtls.
listening-port=3478

# UDP relay port range, opened directly on the host (network_mode: host).
# Firewall must allow it. ~850 concurrent relayed legs — plenty for a
# single-operator deploy; widen together with the firewall rule.
min-port=49152
max-port=49999

# The public relay address comes from --external-ip (TURN_EXTERNAL_IP)
# in docker-compose.yml.

# Authentication: long-term-credential mechanism + REST-API shared secret.
# Server-side mints time-bounded credentials per RFC 5766. coturn verifies
# HMAC-SHA1(static-auth-secret, username) == credential.
lt-cred-mech
use-auth-secret

# Realm — appears in TURN auth attribute. Match server hostname for
# production deploys.
realm=sinhron

# Fingerprint attribute — recommended for compatibility per RFC 5389.
fingerprint

# Logging. `verbose` is too noisy; production runs WARN+ via env override.
no-cli
no-tls
no-dtls

# WebRTC only needs UDP relays; RFC 6062 TCP relays just widen abuse
# surface (TURN as a generic TCP proxy). This does NOT block clients that
# reach coturn over TCP or TLS/443 (ADR-016/041): their media is relayed
# onwards as UDP to LiveKit, which is all WebRTC needs.
no-tcp-relay

# Disable risky listeners.
no-multicast-peers
no-loopback-peers
denied-peer-ip=0.0.0.0-0.255.255.255
denied-peer-ip=127.0.0.0-127.255.255.255
denied-peer-ip=10.0.0.0-10.255.255.255
denied-peer-ip=100.64.0.0-100.127.255.255
denied-peer-ip=169.254.0.0-169.254.255.255
denied-peer-ip=172.16.0.0-172.31.255.255
denied-peer-ip=192.0.0.0-192.0.0.255
denied-peer-ip=192.0.2.0-192.0.2.255
denied-peer-ip=192.88.99.0-192.88.99.255
denied-peer-ip=192.168.0.0-192.168.255.255
denied-peer-ip=198.18.0.0-198.19.255.255
denied-peer-ip=198.51.100.0-198.51.100.255
denied-peer-ip=203.0.113.0-203.0.113.255
denied-peer-ip=240.0.0.0-255.255.255.255
# IPv6 too (security review 2026-11-02): on a host with IPv6 the relay
# reached private and link-local v6 networks — including the Docker
# `egress6` addresses of Caddy and sinhron-server — and v4 networks
# through mapped / NAT64 forms.
denied-peer-ip=::ffff:0.0.0.0-::ffff:255.255.255.255
denied-peer-ip=64:ff9b::-64:ff9b::ffff:ffff
denied-peer-ip=100::-100::ffff:ffff:ffff:ffff
denied-peer-ip=2001:db8::-2001:db8:ffff:ffff:ffff:ffff:ffff:ffff
denied-peer-ip=fc00::-fdff:ffff:ffff:ffff:ffff:ffff:ffff:ffff
denied-peer-ip=fe80::-febf:ffff:ffff:ffff:ffff:ffff:ffff:ffff

# Ceilings, so the relay can't be turned into a free bandwidth pipe:
# at most 1200 relays at once, each up to 1 MB/s (8 Mbit/s — a 1080p
# video call needs ~2.5).
total-quota=1200
max-bps=1000000
# ...and at most 96 per person: the whole username is the same for one
# person for a day (handlers/call.rs turn_username, LIMIT-1), so one free
# account can't hold every relay slot (security review 2026-11,
# deploy-deps:3). A device in a call uses up to ~12, and a reconnect
# (Wi-Fi -> LTE) takes 12 more while the old ones live on for minutes;
# 96 covers two devices reconnecting a few times. No bps-capacity: coturn
# reserves max-bps per relay from it, so 30 Mbit/s would mean only 30
# relays at all.
user-quota=96
