# sinhron_net — WebSocket + protobuf client for the operator server.
#
# Per spec §5.2: tokio + tokio-tungstenite + rustls (NOT native-tls, so we
# cross-compile cleanly to iOS arm64 without dragging OpenSSL into the
# app bundle). The .proto schema is kept in sync with `server/proto/`
# manually — see the README comment in proto/sinhron.proto.
#
# Versions match the server's where possible so a single workspace lock
# resolves cleanly. The exception is `prost` — we pull the same major
# but our wire format only needs decode + re-encode of WsFrame, no
# server-side bells. iOS link size matters: keep transitive deps lean.

[package]
name = "sinhron_net"
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
publish = false

[dependencies]
# Async runtime — same LTS as the server (spec §5.2 line 151).
tokio = { version = "=1.51.6", features = ["rt-multi-thread", "macros", "net", "io-util", "time", "sync"] }

# WS client. rustls-tls-webpki-roots gives us a pure-Rust TLS stack +
# bundled root CAs. NO native-tls — that would pull OpenSSL into the iOS
# app bundle and break the slim-binary target.
tokio-tungstenite = { version = "=0.29.0", features = ["rustls-tls-webpki-roots"] }
# Optional SOCKS5 proxy (Tor / Orbot) for the WS connection — hides the
# phone's IP from the server. Same version reqwest's `socks` feature uses.
tokio-socks = "=0.5.2"

# WU B3 — direct rustls + pemfile so we can build a constrained
# `ClientConfig` for TLS pinning (operator-bundled CA, no webpki roots).
# Version MUST match what tokio-tungstenite 0.29 resolves to (rustls
# 0.23.x) — otherwise two rustls copies in the link graph blow up
# `LinkOrder` on iOS. `ring` backend matches what tokio-tungstenite
# pulls (no aws-lc-rs feature flag here).
rustls = { version = "=0.23.46", default-features = false, features = ["std", "ring", "tls12", "logging"] }
rustls-pemfile = "=2.2.0"

# Protobuf decode for WsFrame. Same crate as the server uses.
prost = "=0.13.5"

# Cryptography — Ed25519 sign of the WS auth challenge.
ed25519-dalek = "=2.1.1"

# Time, errors, hex.
time = "=0.3.47"
hex = "=0.4.3"
anyhow = "=1.0.103"
thiserror = "=2.0.11"
bytes = "=1.11.1"
futures-util = "=0.3.31"

# Tracing — same crate as elsewhere; the FFI layer initialises the
# subscriber once at app boot.
tracing = "=0.1.41"

# URL parsing for the configured server endpoint.
url = "=2.5.8"

# ADR-072 — our server's address when the phone's DNS answers wrong:
# DNS-over-HTTPS queries (JSON over reqwest, same pin / features as
# sinhron_sync, so the link graph has one copy), the address check (a TLS
# handshake via tokio-rustls — the version tokio-tungstenite already pulls,
# ring only) with the webpki roots the default connectors use, and the
# remembered addresses as JSON.
reqwest = { version = "=0.12.24", default-features = false, features = ["json", "rustls-tls-webpki-roots"] }
tokio-rustls = { version = "=0.26.4", default-features = false, features = ["ring", "tls12", "logging"] }
webpki-roots = "=1.0.10"
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.140"

[dev-dependencies]
# UUIDs in the example smoke (not used in the public API yet).
uuid = { version = "=1.18.0", features = ["v7"] }

[build-dependencies]
prost-build = "=0.13.5"

[lib]
# rlib — sinhron_core (the frb facade at ../) pulls us in as a path dep.
crate-type = ["rlib"]
